name: Astryx trial validation

on:
  push:
    branches:
      - test/astryx-ui-trial
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Generate workspace lockfile
        run: |
          echo "Resolving Astryx packages declared in artifacts/menuya/package.json"
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: lock Astryx trial dependencies"
            git push
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Menuya
        run: pnpm --filter @workspace/menuya typecheck
      - name: Build Menuya
        run: pnpm --filter @workspace/menuya build
