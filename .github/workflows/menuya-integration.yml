name: MENUYA integration checks

permissions:
  contents: write

on:
  push:
    branches:
      - integration/supabase-auth
    paths-ignore:
      - pnpm-lock.yaml
  pull_request:
    branches:
      - main

jobs:
  menuya:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Commit resolved pnpm lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore(menuya): refresh pnpm lockfile'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Typecheck MENUYA
        run: pnpm --filter @workspace/menuya typecheck
      - name: Build MENUYA
        run: pnpm --filter @workspace/menuya build
