name: Menuya validation

on:
  pull_request:
    branches:
      - integration/supabase-auth
    paths:
      - 'artifacts/menuya/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'lib/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/menuya-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menuya-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and build
        run: |
          pnpm run typecheck
          pnpm --filter @workspace/menuya build
      - name: Lint changed Edge Functions
        run: |
          if [ -d supabase/functions ]; then
            npx --yes deno-bin lint supabase/functions/courier-access/index.ts supabase/functions/create-store-order/index.ts
          fi
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
          PORT: '5000'
