name: Atomic storefront order validation

on:
  pull_request:
    paths:
      - "supabase/functions/create-store-order/**"
      - "supabase/migrations/*atomic_storefront_order*"
      - "tests/sql/atomic-storefront-order.*.sql"
      - ".github/workflows/atomic-storefront-order.yml"
  push:
    branches:
      - "perf/storefront-orders-atomic"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menuya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d menuya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Edge Function
        run: deno lint supabase/functions/create-store-order/index.ts

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create disposable test schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d menuya_test -v ON_ERROR_STOP=1 -f tests/sql/atomic-storefront-order.setup.sql

      - name: Apply migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d menuya_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261110170000_atomic_storefront_order_creation.sql

      - name: Verify commit and rollback behavior
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d menuya_test -v ON_ERROR_STOP=1 -f tests/sql/atomic-storefront-order.integration.sql

      - name: Verify concurrent order numbering
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d menuya_test -v ON_ERROR_STOP=1 -c "
            select public.create_storefront_order_atomic(
              '11111111-1111-4111-8111-111111111111',
              'Concurrente A', '3000000001',
              jsonb_build_object('fulfillment_type','pickup','subtotal',1000,'total',1000,'tracking_token','concurrent-token-a'),
              jsonb_build_array(jsonb_build_object('product_id','22222222-2222-4222-8222-222222222222','product_name','Prueba','unit_price',1000,'quantity',1,'line_total',1000,'addons_snapshot','[]'::jsonb)),
              '1111111111111111111111111111111111111111111111111111111111111111',
              'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1'
            );" > /tmp/order-a.json &
          pid_a=$!
          psql -h localhost -U postgres -d menuya_test -v ON_ERROR_STOP=1 -c "
            select public.create_storefront_order_atomic(
              '11111111-1111-4111-8111-111111111111',
              'Concurrente B', '3000000002',
              jsonb_build_object('fulfillment_type','pickup','subtotal',1000,'total',1000,'tracking_token','concurrent-token-b'),
              jsonb_build_array(jsonb_build_object('product_id','22222222-2222-4222-8222-222222222222','product_name','Prueba','unit_price',1000,'quantity',1,'line_total',1000,'addons_snapshot','[]'::jsonb)),
              '2222222222222222222222222222222222222222222222222222222222222222',
              'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2'
            );" > /tmp/order-b.json &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          psql -h localhost -U postgres -d menuya_test -v ON_ERROR_STOP=1 -c "
            do \$\$
            begin
              if (select count(*) from public.orders) <> 4
                 or (select count(distinct order_number) from public.orders) <> 4
                 or (select min(order_number) from public.orders) <> 1
                 or (select max(order_number) from public.orders) <> 4 then
                raise exception 'La concurrencia produjo consecutivos duplicados o faltantes';
              end if;
            end;
            \$\$;"
          # Two identical simultaneous retries must converge on one persisted order.
          psql -h localhost -U postgres -d menuya_test -v ON_ERROR_STOP=1 -c "
            select public.create_storefront_order_atomic(
              '11111111-1111-4111-8111-111111111111',
              'Reintento concurrente', '3000000003',
              jsonb_build_object('fulfillment_type','pickup','subtotal',1000,'total',1000,'tracking_token','retry-token-a'),
              jsonb_build_array(jsonb_build_object('product_id','22222222-2222-4222-8222-222222222222','product_name','Prueba','unit_price',1000,'quantity',1,'line_total',1000,'addons_snapshot','[]'::jsonb)),
              '3333333333333333333333333333333333333333333333333333333333333333',
              'cccccccc-cccc-4ccc-8ccc-ccccccccccc1'
            );" > /tmp/retry-a.json &
          retry_a=$!
          psql -h localhost -U postgres -d menuya_test -v ON_ERROR_STOP=1 -c "
            select public.create_storefront_order_atomic(
              '11111111-1111-4111-8111-111111111111',
              'Reintento concurrente', '3000000003',
              jsonb_build_object('fulfillment_type','pickup','subtotal',1000,'total',1000,'tracking_token','retry-token-b'),
              jsonb_build_array(jsonb_build_object('product_id','22222222-2222-4222-8222-222222222222','product_name','Prueba','unit_price',1000,'quantity',1,'line_total',1000,'addons_snapshot','[]'::jsonb)),
              '3333333333333333333333333333333333333333333333333333333333333333',
              'cccccccc-cccc-4ccc-8ccc-ccccccccccc1'
            );" > /tmp/retry-b.json &
          retry_b=$!
          wait "$retry_a"
          wait "$retry_b"
          psql -h localhost -U postgres -d menuya_test -v ON_ERROR_STOP=1 -c "
            do \$\$
            begin
              if (select count(*) from public.orders) <> 5
                 or (select count(distinct order_number) from public.orders) <> 5
                 or (select count(*) from public.storefront_order_idempotency) <> 5 then
                raise exception 'Dos reintentos simultáneos con la misma clave crearon más de un pedido';
              end if;
            end;
            \$\$;"
