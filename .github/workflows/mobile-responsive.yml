name: Mobile responsive audit

on:
  workflow_dispatch:
  push:
    branches:
      - integration/supabase-auth
    paths:
      - 'artifacts/menuya/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-responsive.yml'

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Menuya
        run: pnpm --filter @workspace/menuya build
      - name: Run responsive audit
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menuya-responsive-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
