<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>CLICKOK — Catálogos y pedidos para negocios locales</title>
    <meta name="description" content="CLICKOK ayuda a negocios locales a publicar catálogos digitales y organizar sus pedidos, directo con sus clientes." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Atom Labs" />
    <meta name="application-name" content="CLICKOK" />
    <meta name="copyright" content="Atom Labs" />
    <meta property="og:title" content="CLICKOK — Catálogos y pedidos para negocios locales" />
    <meta property="og:description" content="Publica tu catálogo digital y recibe pedidos organizados. Tu negocio, directo con tus clientes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CLICKOK — Catálogos y pedidos para negocios locales" />
    <meta name="twitter:description" content="Publica tu catálogo digital y recibe pedidos organizados. Tu negocio, directo con tus clientes." />
    <meta name="theme-color" content="#182331" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function showBootError(message) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          var panel = document.getElementById('menuya-boot-error');
          if (!panel) {
            panel = document.createElement('div');
            panel.id = 'menuya-boot-error';
            panel.style.cssText = 'font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:12vh auto;padding:28px;color:#182331;background:#fff;border:1px solid #d8deea;border-radius:16px;box-shadow:0 12px 40px #18233118';
            document.body.appendChild(panel);
          }
          panel.innerHTML = '<h2 style="margin:0 0 10px">Menuya no pudo iniciar</h2><p style="margin:0 0 8px">Detectamos un error al cargar la aplicación. Este detalle nos ayudará a corregirlo:</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f9;padding:12px;border-radius:8px"></pre><p style="margin:12px 0 0;font-size:13px;color:#596579">No cierres esta pantalla; envíanos una captura.</p>';
          panel.querySelector('pre').textContent = String(message || 'Error de inicio sin detalle');
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          var detail = event.message || (target && (target.src || target.href)) || 'No se pudo cargar un recurso de la aplicación';
          showBootError(detail);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showBootError(reason && (reason.message || String(reason)) || 'Promesa rechazada al iniciar');
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) showBootError('La aplicación no montó ningún componente después de 15 segundos. Revisa si el archivo JavaScript principal pudo cargarse.');
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
